<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sunday Team · The Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Mulish:wght@300;400;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F1EDE9; --gold:#CA8D32; --brown:#754C24; --ink:#111; --white:#fff;
  --muted:#5f5850; --line:#ddd5cc;
  --head:"Futura PT","Futura","Jost",system-ui,sans-serif;
  --body:"Europa","Mulish",system-ui,sans-serif;
  --script:"Mrs Saint Delafield",cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media print{html{scroll-behavior:auto}}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-weight:400;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--brown)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}

/* Cover */
header.cover{background:var(--ink);color:var(--white);text-align:center;padding:44px 20px 40px}
.wordmark{font-family:var(--head);font-weight:400;letter-spacing:.42em;font-size:15px;text-transform:uppercase}
.wordmark .slash{color:var(--gold);margin:0 .25em}
.wordmark small{display:block;font-size:11px;letter-spacing:.5em;margin-top:6px;opacity:.85}
.cover .script{font-family:var(--script);color:var(--gold);font-size:44px;line-height:1;margin:28px 0 0}
.cover h1{font-family:var(--head);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:clamp(30px,7vw,46px);margin:0 0 8px}
.cover p{margin:0 auto;max-width:520px;opacity:.85;font-size:15px}

/* Contents */
nav.toc{background:var(--white);border-radius:14px;padding:18px 20px;margin:-22px auto 28px;position:relative;box-shadow:0 6px 24px rgba(0,0,0,.08);max-width:860px}
nav.toc h2{font-family:var(--head);font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
nav.toc ol{margin:0;padding-left:22px}
nav.toc li{padding:5px 0;font-weight:600}
nav.toc a{text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.printnote{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Sections */
section.part{margin-top:40px}
.kicker{font-family:var(--head);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0}
section.part > h2{font-family:var(--head);font-weight:500;font-size:clamp(26px,5.4vw,34px);letter-spacing:.02em;margin:4px 0 10px;text-transform:uppercase}
.intro{color:var(--muted);margin:0 0 18px}
h3.group{font-family:var(--head);font-weight:500;font-size:21px;margin:34px 0 12px;padding-top:14px;border-top:2px solid var(--gold)}
h3.group span.l{color:var(--gold);margin-right:8px}

/* Role cards */
.role{display:grid;gap:12px}
.rolecard{background:var(--white);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.rolecard .ic{flex:0 0 40px;height:40px;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--brown);font-weight:700;font-family:var(--head)}
.rolecard b{display:block;font-size:18px;margin-bottom:2px}
.rolecard p{margin:0;color:var(--muted)}

/* Running order */
.order{background:var(--ink);color:var(--white);border-radius:14px;padding:18px 20px;margin:0 0 6px}
.order h4{font-family:var(--head);font-weight:500;letter-spacing:.15em;text-transform:uppercase;font-size:13px;color:var(--gold);margin:0 0 10px}
.order ol{margin:0;padding-left:26px;columns:2;column-gap:28px}
.order li{padding:3px 0;break-inside:avoid}
.order li.tag::marker{color:var(--gold)}
.pill{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--ink);padding:1px 7px;border-radius:20px;margin-left:6px;font-weight:700;vertical-align:2px}
@media (max-width:520px){.order ol{columns:1}}

/* Steps */
.step{background:var(--white);border-radius:16px;overflow:hidden;margin:0 0 16px;box-shadow:0 2px 10px rgba(0,0,0,.05);break-inside:avoid;page-break-inside:avoid}
.step .txt{display:flex;gap:14px;padding:16px 18px 14px;align-items:flex-start}
.step .txt > div:last-child{flex:1;min-width:0}
.num{flex:0 0 42px;height:42px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--head);font-weight:600;font-size:20px;display:grid;place-items:center}
.step h4{margin:0;font-size:20px;line-height:1.3;font-weight:700}
.k{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap;font-weight:700}
.step p{margin:4px 0 0;color:var(--muted);font-size:16px}
.shot{position:relative;display:block;width:100%;border:0;padding:0;margin:0;background:#1d1d1f;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
.mark{position:absolute;width:6.5%;min-width:34px;aspect-ratio:1;border:4px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.55);pointer-events:none}
.mark.box{border-radius:12px;transform:none;aspect-ratio:auto}
.mark i{position:absolute;top:-14px;right:-14px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--ink);font:700 15px/28px var(--head);font-style:normal;text-align:center;box-shadow:0 0 0 2px #000}
.zoomhint{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 9px;border-radius:20px}

.tip{background:#fbf6ee;border-left:4px solid var(--gold);border-radius:10px;padding:12px 16px;margin:0 0 16px;font-size:16px}
.tip b{color:var(--brown)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px}
.sw i{width:20px;height:20px;border-radius:50%;display:inline-block}

.placeholder{border:2px dashed var(--gold);border-radius:16px;padding:22px;text-align:center;color:var(--muted);background:rgba(255,255,255,.5)}

/* Checklists (tap to tick) */
.check{list-style:none;padding:0;margin:0}
.check li{background:var(--white);border-radius:12px;padding:12px 14px 12px 48px;margin-bottom:8px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.check li::before{content:"";position:absolute;left:14px;top:13px;width:20px;height:20px;border:2px solid var(--gold);border-radius:5px;font:700 15px/17px var(--head);text-align:center;color:var(--ink)}
.check li.done::before{content:"✓";background:var(--gold)}
.check li.done b{text-decoration:line-through;color:var(--muted)}
.check li small{display:block;color:var(--muted)}
.checkbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin:0 0 10px}

footer{text-align:center;color:var(--muted);font-size:13px;margin-top:48px}
footer a{color:var(--muted)}

/* Lightbox */
#lb{position:fixed;inset:0;background:#000;z-index:50;display:none;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
#lb.open{display:block}
#lb .inner{min-height:100%;display:flex;align-items:center;justify-content:center;padding:52px 0 20px}
#lb .frame{position:relative;width:100%;max-width:1600px}
#lb .bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,.75);color:#fff;font-size:14px;z-index:2}
#lb button.close{background:var(--gold);border:0;color:#000;font-weight:700;border-radius:20px;padding:7px 14px;font-size:15px}
#lb .zoombtns button{background:#333;color:#fff;border:0;border-radius:20px;padding:7px 12px;margin-left:6px;font-size:15px}

/* ---------- App additions ---------- */
.topnav{display:flex;justify-content:space-between;gap:10px;padding:12px 0 0;font-size:14px;position:relative;z-index:2}
.topnav a{text-decoration:none;font-weight:700}
.home{margin-top:16px}
.card{background:var(--white);border-radius:14px;padding:18px 20px;margin:0 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card h3{font-family:var(--head);font-weight:500;font-size:21px;margin:0 0 6px}
.card p{margin:0 0 10px;color:var(--muted)}
.card p:last-child{margin-bottom:0}
.eyebrow{font-family:var(--head);font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px}
a.areacard{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--white);border-radius:14px;padding:16px 18px;margin:0 0 10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
a.areacard b{display:block;font-size:19px}
a.areacard span.d{display:block;color:var(--muted);font-size:15px}
a.areacard::after{content:"›";margin-left:auto;font-size:30px;color:var(--gold);line-height:1}
.btn{display:inline-block;background:var(--gold);color:var(--ink);border:0;border-radius:24px;padding:11px 20px;font:700 16px var(--body);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;border:2px solid var(--gold);padding:9px 18px}
.btn.small{padding:6px 12px;font-size:14px}
.btn.ghost.small{padding:4px 11px}
.btn[disabled]{opacity:.5}
button.link{background:none;border:0;padding:0;color:var(--brown);font:inherit;text-decoration:underline;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.form label{display:block;font-weight:700;font-size:15px;margin:14px 0 4px}
.form label.inline{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:16px;margin:8px 0}
.form label.inline input{margin-top:5px;width:18px;height:18px;flex:0 0 18px;accent-color:var(--gold)}
.form input[type=text],.form input[type=email],.form input[type=tel],.form textarea,.form select,select.status{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.form textarea{min-height:84px;resize:vertical}
.form .hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.form .row{margin-top:18px;justify-content:flex-end}
.form img.cur{display:block;max-width:100%;border-radius:8px;margin:6px 0}
.hp{position:absolute;left:-9999px}
dialog{border:0;border-radius:16px;padding:20px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--cream);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{font-family:var(--head);font-weight:500;font-size:22px;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.tools button{border:1px solid var(--line);background:var(--cream);border-radius:8px;padding:4px 10px;font:600 13px var(--body);color:var(--ink);cursor:pointer}
.tools button.del{color:#9a2b1c}
.addbtn{display:block;width:100%;border:2px dashed var(--gold);background:rgba(255,255,255,.5);border-radius:12px;padding:12px;font:700 16px var(--body);color:var(--brown);margin:0 0 16px;cursor:pointer}
.editfab{position:fixed;right:14px;bottom:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.banner{background:var(--brown);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;margin:12px 0 0;position:relative;z-index:2}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:22px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.linkrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.linkrow input{flex:1;min-width:0;font:13px ui-monospace,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--cream);color:var(--muted)}
.su{border-left:4px solid var(--gold)}
.su.contacted,.su.rostered{border-left-color:var(--line)}
.su .meta{font-size:13px;color:var(--muted)}
select.status{width:auto;padding:6px 10px;font-size:14px}
.tags{font-size:14px;color:var(--muted)}

/* Landscape phones: let the picture use the screen */
@media (orientation:landscape) and (max-height:500px){
  .wrap{max-width:none;padding:0 10px 48px}
  .step .txt{padding:10px 14px}
  .step h4{font-size:18px}
}

/* Print on A4 */
@page{size:A4;margin:14mm 12mm}
@media print{
  body{background:#fff;font-size:11.5pt}
  header.cover{background:#fff;color:#000;padding:0 0 10mm;border-bottom:2px solid var(--gold)}
  .cover p{opacity:1}
  nav.toc{box-shadow:none;margin:6mm 0;border:1px solid var(--line)}
  .printnote,.zoomhint,#lb,.topnav,.tools,.addbtn,.editfab,.banner,#toast,.checkbar,.noprint{display:none !important}
  .wrap{max-width:none;padding:0}
  section.part{break-before:page;margin-top:0}
  section.part:first-of-type{break-before:auto}
  h3.group,.tip,.order{break-after:avoid;page-break-after:avoid}
  .step{box-shadow:none;border:1px solid var(--line);display:grid;grid-template-columns:40% 60%;align-items:start}
  .step .txt{padding:10px 12px}
  .step h4{font-size:12.5pt}
  .step p{font-size:10.5pt}
  .shot{background:none}
  .mark{border-width:3px}
  .rolecard,.check li{border:1px solid var(--line);break-inside:avoid}
  .check li.done::before{content:"";background:none}
  .check li.done b{text-decoration:none;color:inherit}
  .k{white-space:normal}
  .order{background:#fff;color:#000;border:1px solid var(--ink)}
  a{text-decoration:none;color:inherit}
}
</style>
</head>
<body>

<header class="cover" id="cover">
  <div class="wordmark">The<span class="slash">/</span>Collective<small>Church</small></div>
</header>

<div class="wrap">
  <div id="banner"></div>
  <main id="view"><p style="text-align:center;color:#5f5850;margin-top:40px">Loading…</p></main>

  <footer>
    <div class="wordmark" style="color:#111">The<span class="slash">/</span>Collective<small>Church</small></div>
    <p>Spotted a missing step? Let your team lead know so this guide can be updated.</p>
    <p class="noprint"><a href="#/signup">Join a team</a> · <a href="#/admin">Team lead sign in</a></p>
  </footer>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Picture viewer">
  <div class="bar"><span id="lbcap">Pinch or use + and − to zoom</span><span><span class="zoombtns"><button type="button" data-z="-1" aria-label="Zoom out">−</button><button type="button" data-z="1" aria-label="Zoom in">+</button></span> <button type="button" class="close">Close</button></span></div>
  <div class="inner"><div class="frame" id="lbframe"></div></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<!--
  CONTENT lives in the database (Supabase), one JSON document per area.
  data/seed.json is the starting content and is what you see in local preview.
  See README.md for the structure.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
